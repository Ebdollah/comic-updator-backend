# Development Docker Compose
version: '3.8'

services:
  comic-updator-backend-dev:
    build: .
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
    env_file:
      - env.example
    volumes:
      - .:/app
      - /app/__pycache__
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - comic-updator-dev-network

networks:
  comic-updator-dev-network:
    driver: bridge
